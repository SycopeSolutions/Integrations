zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 5c4bf6e37439437cbf003b9d42418832
    name: Templates/Applications
  templates:
  - uuid: 14cd875fb21e4933b418863e9724c8d1
    template: Sycope Monitoring
    name: Sycope Monitoring
    description: |
      Network data of one host from Sycope NTA/Security (REST API, NQL queries filtered by {HOST.IP}).
      Four external-check master items (host alerts, active services, matched IPs, connections) run 6 NQL
      queries per host and cycle; all other items are dependent items.
      Requirements:
        - sycope_check.py 2.0+ in the ExternalScripts directory
        - /etc/zabbix/sycope.conf with SYCOPE_USER and SYCOPE_PASSWORD
        - macro {$SYCOPE_IP} = Sycope appliance address (set on the host or globally)
      For data about Sycope itself (no IP filter) link the template "Sycope Appliance" to the Sycope host.
    groups:
    - name: Templates/Applications
    macros:
    - macro: '{$SYCOPE_IP}'
      value: sycope.example.com
      description: Sycope appliance IP
    - macro: '{$SYCOPE_ALERT_MINUTES}'
      value: '15'
      description: Alert query lookback (minutes)
    - macro: '{$SYCOPE_ASSET_DAYS}'
      value: '7'
      description: Active services lookback (days)
    - macro: '{$SYCOPE_SKIP_NAT_PORTS}'
      value: 'true'
      description: 'Active services: ignore server ports 49152 and above (ephemeral/NAT ports)'
    - macro: '{$SYCOPE_ASSET_DELAY}'
      value: 1h
      description: 'Active services: check interval (the query covers {$SYCOPE_ASSET_DAYS} days of traffic)'
    - macro: '{$SYCOPE_MATCHED_MINUTES}'
      value: '60'
      description: Matched IPs lookback (minutes)
    - macro: '{$SYCOPE_CONN_MINUTES}'
      value: '30'
      description: Connections lookback (minutes)
    - macro: '{$SYCOPE_ALERT_WARN}'
      value: '1'
      description: 'Warning threshold: alert count'
    - macro: '{$SYCOPE_ALERT_HIGH}'
      value: '5'
      description: 'High threshold: alert count'
    - macro: '{$SYCOPE_ERROR_PERIOD}'
      value: 15m
      description: 'Checks failing: period in which every connections check returned an error'
    - macro: '{$SYCOPE_NODATA_PERIOD}'
      value: 30m
      description: 'Checks failing: period without any connections check result'
    - macro: '{$SYCOPE_TIMEOUT}'
      value: 20s
      description: Timeout of each check (overrides the Zabbix server Timeout)
    items:
    - uuid: dbb0bce6eb96488a888384e3954b0819
      name: Sycope - Host alerts (raw)
      type: EXTERNAL
      key: sycope_check.py["{$SYCOPE_IP}","host_alerts","{HOST.IP}","{$SYCOPE_ALERT_MINUTES}"]
      delay: 5m
      timeout: '{$SYCOPE_TIMEOUT}'
      history: 1d
      trends: '0'
      value_type: TEXT
      description: One NQL query for all alerts of the host (client or server side) in the last {$SYCOPE_ALERT_MINUTES} minutes. JSON with totals, severity counts and per-alert-name counts; the alert items are dependent items of this one.
      tags:
      - tag: component
        value: alerts
      - &id001
        tag: source
        value: sycope
      - tag: type
        value: raw
    - uuid: 01fe3fe6b4f5440dbbfb3b6adc0a253d
      name: Sycope - Active services (raw)
      type: EXTERNAL
      key: sycope_check.py["{$SYCOPE_IP}","active_services","{HOST.IP}","{$SYCOPE_ASSET_DAYS}","{$SYCOPE_SKIP_NAT_PORTS}"]
      delay: '{$SYCOPE_ASSET_DELAY}'
      timeout: '{$SYCOPE_TIMEOUT}'
      history: 1d
      trends: '0'
      value_type: TEXT
      description: One NQL query for the server ports of the host in the last {$SYCOPE_ASSET_DAYS} days.
      tags:
      - tag: component
        value: asset_discovery
      - *id001
      - tag: type
        value: raw
    - uuid: a03360077b9e422ca766e5ce0b36d6db
      name: Sycope - Matched IPs (raw)
      type: EXTERNAL
      key: sycope_check.py["{$SYCOPE_IP}","matched_ips","{HOST.IP}","{$SYCOPE_MATCHED_MINUTES}"]
      delay: 5m
      timeout: '{$SYCOPE_TIMEOUT}'
      history: 1d
      trends: '0'
      value_type: TEXT
      description: Two NQL queries (traffic matching / not matching a traffic profile) for the matched and unmatched IP counters.
      tags:
      - tag: component
        value: asset_discovery
      - *id001
      - tag: type
        value: raw
    - uuid: d82ac69238c442b69e4b6ac960835d4c
      name: Sycope - Connections (raw)
      type: EXTERNAL
      key: sycope_check.py["{$SYCOPE_IP}","connections","{HOST.IP}","{$SYCOPE_CONN_MINUTES}"]
      delay: 5m
      timeout: '{$SYCOPE_TIMEOUT}'
      history: 1d
      trends: '0'
      value_type: TEXT
      description: Two NQL queries for the connections from and to the host.
      tags:
      - tag: component
        value: asset_discovery
      - *id001
      - tag: type
        value: raw
    - uuid: bd17475f1227487ea58552e9f2a0c89f
      name: Visibility - Only SYN Client TCP Flag
      type: DEPENDENT
      key: sycope.alert.count["Only SYN Client TCP Flag"]
      delay: '0'
      history: 7d
      trends: '0'
      value_type: FLOAT
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          if (d.error) {
              throw d.error;
          }
          var e = (d.by_name || {})["Only SYN Client TCP Flag"];
          return e ? e.value : 0;
        error_handler: CUSTOM_VALUE
        error_handler_params: '-1'
      master_item:
        key: sycope_check.py["{$SYCOPE_IP}","host_alerts","{HOST.IP}","{$SYCOPE_ALERT_MINUTES}"]
      tags:
      - tag: component
        value: visibility
      - tag: source
        value: sycope
      triggers:
      - uuid: 93e1a759894b4fc98c05e8a34c0381c1
        expression: last(/Sycope Monitoring/sycope.alert.count["Only SYN Client TCP Flag"])>{$SYCOPE_ALERT_HIGH}
        name: 'Sycope: Only SYN TCP Flag alerts HIGH on {HOST.NAME}'
        priority: HIGH
      - uuid: 734bc79f0c3f4bd7a2421b9f4021095d
        expression: last(/Sycope Monitoring/sycope.alert.count["Only SYN Client TCP Flag"])>{$SYCOPE_ALERT_WARN} and last(/Sycope Monitoring/sycope.alert.count["Only SYN Client TCP Flag"])<={$SYCOPE_ALERT_HIGH}
        name: 'Sycope: Only SYN TCP Flag alerts detected on {HOST.NAME}'
        priority: WARNING
    - uuid: 8535721701af4a7295daf0cb3b80c6be
      name: Visibility - Only SYN Client TCP Flag (detail)
      type: DEPENDENT
