        value: asset_discovery
      - tag: source
        value: sycope
      triggers:
      - uuid: 9e5ef9cf82d344b4af04e25a47baba56
        expression: max(/Sycope Monitoring/sycope.connections[Private_Connections_From_Node],{$SYCOPE_ERROR_PERIOD})=-1 or nodata(/Sycope Monitoring/sycope.connections[Private_Connections_From_Node],{$SYCOPE_NODATA_PERIOD})=1
        name: 'Sycope: checks failing on {HOST.NAME}'
        priority: AVERAGE
        description: |
          The Sycope checks of this host return errors (wrong credentials in /etc/zabbix/sycope.conf,
          Sycope unreachable, API error) or no results. The items then hold -1 or "error" instead of
          Sycope data, so the other Sycope triggers cannot fire. The raw JSON of the failing check is
          kept for 1 day in the "(raw)" master items; run sycope_check.py as the zabbix user to retry.
        tags:
        - tag: scope
          value: availability
