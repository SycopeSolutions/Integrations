zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 5c4bf6e37439437cbf003b9d42418832
    name: Templates/Applications
  templates:
  - uuid: a2b77303c3bc4b4581b6a54dd22cb68d
    template: Sycope Appliance
    name: Sycope Appliance
    description: |
      Health and global data of a Sycope NTA/Security appliance, without filtering by IP.
      Link it to the host that represents the Sycope appliance: the checks use {HOST.CONN} (the host's main
      interface) as the Sycope API address.
      Three external-check master items run 8-9 NQL queries per cycle (self-monitoring "metrics" stream,
      netflowTotalAggr, netflowByExporterAggr, alerts, notifications); everything else is dependent items
      and low-level discovery (disks, flow exporters).
      Requirements: sycope_check.py 2.0+ in ExternalScripts and /etc/zabbix/sycope.conf (SYCOPE_USER,
      SYCOPE_PASSWORD), the same as for the template "Sycope Monitoring".
    groups:
    - name: Templates/Applications
    items:
    - uuid: a15c864b0b964ee4b7fcac8f3e83cc85
      name: Sycope - Health (raw)
      type: EXTERNAL
      key: sycope_check.py["{HOST.CONN}","appliance_health","-","{$SYCOPE_WINDOW_MINUTES}"]
      delay: 5m
      timeout: '{$SYCOPE_TIMEOUT}'
      history: 1d
      trends: '0'
      value_type: TEXT
      description: 'Self-monitoring of the Sycope appliance from its "metrics" stream: CPU, memory, disks, flow reception and decoding, indexing and the internal event bus (3-4 NQL queries).'
      tags:
      - tag: component
        value: health
      - &id001
        tag: source
        value: sycope
      - tag: type
        value: raw
    - uuid: 78f3042824134d5dbc423f785f231178
      name: Sycope - Traffic (raw)
      type: EXTERNAL
      key: sycope_check.py["{HOST.CONN}","appliance_traffic","-","{$SYCOPE_WINDOW_MINUTES}","{$SYCOPE_EXPORTER_HOURS}"]
      delay: 5m
      timeout: '{$SYCOPE_TIMEOUT}'
      history: 1d
      trends: '0'
      value_type: TEXT
      description: Total traffic received by Sycope (netflowTotalAggr) and per flow exporter (netflowByExporterAggr) in the last {$SYCOPE_WINDOW_MINUTES} whole minutes, plus the exporters seen in the last {$SYCOPE_EXPORTER_HOURS} hours (3 NQL queries).
      tags:
      - tag: component
        value: traffic
      - *id001
      - tag: type
        value: raw
    - uuid: f9cc52c0e7954551bbb0afb0762f761a
      name: Sycope - Alerts (raw)
      type: EXTERNAL
      key: sycope_check.py["{HOST.CONN}","appliance_alerts","-","{$SYCOPE_WINDOW_MINUTES}"]
      delay: 5m
      timeout: '{$SYCOPE_TIMEOUT}'
      history: 1d
      trends: '0'
      value_type: TEXT
      description: All Sycope alerts in the whole network and Sycope system notifications (license, services) in the last {$SYCOPE_WINDOW_MINUTES} minutes (2 NQL queries).
      tags:
      - tag: component
        value: alerts
      - *id001
      - tag: type
        value: raw
    - uuid: 1c88971c57274b78bac149dd72387b6c
      name: Health - CPU utilization
      type: DEPENDENT
      key: sycope.cpu.util
      delay: '0'
      history: 31d
      trends: 365d
      value_type: FLOAT
      units: '%'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cpu_util
        error_handler: CUSTOM_VALUE
        error_handler_params: '-1'
      master_item:
        key: sycope_check.py["{HOST.CONN}","appliance_health","-","{$SYCOPE_WINDOW_MINUTES}"]
      tags:
      - tag: component
        value: health
      - *id001
      triggers:
      - uuid: eff13512c7da4cfdb65cfb1bb0aaeea9
        expression: min(/Sycope Appliance/sycope.cpu.util,15m)>{$SYCOPE_CPU_MAX}
        name: 'Sycope: high CPU utilization (over {$SYCOPE_CPU_MAX}% for 15m)'
        priority: WARNING
        tags:
        - tag: scope
          value: performance
      - uuid: 60ebcf605b8d459b96a2498742291e6a
        expression: max(/Sycope Appliance/sycope.cpu.util,{$SYCOPE_ERROR_PERIOD})=-1 or nodata(/Sycope Appliance/sycope.cpu.util,{$SYCOPE_NODATA_PERIOD})=1
        name: 'Sycope: API checks failing on {HOST.NAME}'
        priority: AVERAGE
        description: The Sycope appliance checks return errors (wrong credentials in /etc/zabbix/sycope.conf, Sycope unreachable, API error) or no results, so the items hold -1 and the other triggers cannot fire. The raw JSON with the error is in the "(raw)" items.
        tags:
        - tag: scope
          value: availability
    - uuid: 74c81a42c7a94b52ae3e9fcf0126d9a1
      name: Health - Memory utilization
      type: DEPENDENT
      key: sycope.memory.util
      delay: '0'
