    - uuid: d27449912ef0474481f33d3f4e53c645
      name: Health - Metrics age
      type: DEPENDENT
      key: sycope.metrics.age
      delay: '0'
      history: 31d
      trends: 365d
      value_type: FLOAT
      units: s
      description: Seconds since the newest record of the Sycope "metrics" stream. Sycope writes it every minute; a growing age means its processing pipeline or indexing stopped.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.metrics_age
        error_handler: CUSTOM_VALUE
        error_handler_params: '-1'
      master_item:
        key: sycope_check.py["{HOST.CONN}","appliance_health","-","{$SYCOPE_WINDOW_MINUTES}"]
