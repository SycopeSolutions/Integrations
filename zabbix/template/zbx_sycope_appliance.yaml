    discovery_rules:
    - uuid: 7067c99573b44fabbdba232709345a91
      name: Sycope disks
      type: DEPENDENT
      key: sycope.disks.discovery
      delay: '0'
      lifetime: 7d
      description: File systems of the Sycope appliance from the osDisksUtil self-monitoring metrics.
      item_prototypes:
      - uuid: 5b1955624e224b8b861070409d00f8a0
        name: 'Disk {#DISK}: used, in %'
        type: DEPENDENT
        key: sycope.disk.pused[{#DISK}]
        delay: '0'
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: '%'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.disks[?(@.name=='{#DISK}')].pused.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '-1'
        master_item:
          key: sycope_check.py["{HOST.CONN}","appliance_health","-","{$SYCOPE_WINDOW_MINUTES}"]
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
        - *id001
        trigger_prototypes:
        - uuid: b9498281aded41ca83bc6fb19b3dc9a0
          expression: last(/Sycope Appliance/sycope.disk.pused[{#DISK}])>{$SYCOPE_DISK_PUSED_CRIT}
          name: 'Sycope: disk {#DISK} almost full (over {$SYCOPE_DISK_PUSED_CRIT}%)'
          priority: HIGH
          tags:
          - tag: scope
            value: capacity
        - uuid: f0067a543471478792403e71ee09a03c
          expression: last(/Sycope Appliance/sycope.disk.pused[{#DISK}])>{$SYCOPE_DISK_PUSED_WARN}
          name: 'Sycope: disk {#DISK} usage over {$SYCOPE_DISK_PUSED_WARN}%'
          priority: WARNING
          dependencies:
          - name: 'Sycope: disk {#DISK} almost full (over {$SYCOPE_DISK_PUSED_CRIT}%)'
            expression: last(/Sycope Appliance/sycope.disk.pused[{#DISK}])>{$SYCOPE_DISK_PUSED_CRIT}
          tags:
          - tag: scope
            value: capacity
      - uuid: 42009795a23e40bfa3443fe69e162c60
        name: 'Disk {#DISK}: total'
        type: DEPENDENT
        key: sycope.disk.total[{#DISK}]
        delay: '0'
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: B
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.disks[?(@.name=='{#DISK}')].total.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '-1'
        master_item:
          key: sycope_check.py["{HOST.CONN}","appliance_health","-","{$SYCOPE_WINDOW_MINUTES}"]
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
        - *id001
      - uuid: 1b095acac9774ffcbca2b91be5b2fd6e
        name: 'Disk {#DISK}: used'
        type: DEPENDENT
        key: sycope.disk.used[{#DISK}]
        delay: '0'
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: B
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.disks[?(@.name=='{#DISK}')].used.first()
