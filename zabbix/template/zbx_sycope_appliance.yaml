      triggers:
      - uuid: bf001d619c0940f299232e742428b908
        expression: last(/Sycope Appliance/sycope.netflow.udp_dropped)>0 or last(/Sycope Appliance/sycope.netflow.udp_errors)>0 or last(/Sycope Appliance/sycope.decoder.dropped)>0 or last(/Sycope Appliance/sycope.decoder.errors)>0 or last(/Sycope Appliance/sycope.forwarder.dropped)>0
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: max(/Sycope Appliance/sycope.netflow.udp_dropped,15m)<=0 and max(/Sycope Appliance/sycope.netflow.udp_errors,15m)<=0 and max(/Sycope Appliance/sycope.decoder.dropped,15m)<=0 and max(/Sycope Appliance/sycope.decoder.errors,15m)<=0 and max(/Sycope Appliance/sycope.forwarder.dropped,15m)<=0
        name: 'Sycope: flow packets dropped or not decoded'
        priority: WARNING
        description: 'Sycope dropped or failed to decode received flow packets in the last window (listener, decoder or forwarder). Usually the appliance is overloaded or an exporter sends malformed data. Details: item "Health - Problems".'
        tags:
        - tag: scope
          value: collection
