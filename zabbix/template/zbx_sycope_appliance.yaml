      - uuid: 1996d3c815e44bc6aeea826184b12f17
        name: 'Exporter {#EXPORTER}: sending'
        type: DEPENDENT
        key: sycope.exporter.active[{#EXPORTER}]
        delay: '0'
        history: 31d
        trends: 365d
        value_type: FLOAT
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.exporters[?(@.ip=='{#EXPORTER}')].active.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '-1'
        master_item:
          key: sycope_check.py["{HOST.CONN}","appliance_traffic","-","{$SYCOPE_WINDOW_MINUTES}","{$SYCOPE_EXPORTER_HOURS}"]
        tags:
        - tag: component
          value: exporters
        - tag: exporter
          value: '{#EXPORTER}'
        - *id001
        description: 1 = the exporter sent flows in the last window, 0 = silent.
        trigger_prototypes:
        - uuid: 46c4f00a28c34177ab71cfeac4edba10
          expression: max(/Sycope Appliance/sycope.exporter.active[{#EXPORTER}],{$SYCOPE_EXPORTER_SILENT})=0
          name: 'Sycope: exporter {#EXPORTER} stopped sending flows'
          priority: AVERAGE
          description: The exporter sent flows to Sycope in the last {$SYCOPE_EXPORTER_HOURS} hours but none in the last {$SYCOPE_EXPORTER_SILENT}. Check the router/probe export configuration and the path to Sycope. When the exporter was removed on purpose, the problem disappears after {$SYCOPE_EXPORTER_HOURS} hours (LLD).
          tags:
          - tag: scope
            value: collection
      master_item:
        key: sycope_check.py["{HOST.CONN}","appliance_traffic","-","{$SYCOPE_WINDOW_MINUTES}","{$SYCOPE_EXPORTER_HOURS}"]
      lld_macro_paths:
      - lld_macro: '{#EXPORTER}'
        path: $.ip
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.exporters
        error_handler: DISCARD_VALUE
    tags:
    - tag: class
      value: application
    - tag: target
      value: sycope
    macros:
    - macro: '{$SYCOPE_WINDOW_MINUTES}'
      value: '5'
      description: Window of the appliance queries in minutes (keep equal to the 5m item interval)
    - macro: '{$SYCOPE_EXPORTER_HOURS}'
      value: '24'
      description: Exporters seen in this many hours are discovered and expected to send flows
    - macro: '{$SYCOPE_EXPORTER_SILENT}'
      value: 15m
      description: 'Exporter trigger: period without flows from a known exporter'
    - macro: '{$SYCOPE_TIMEOUT}'
      value: 30s
      description: Timeout of each check (overrides the Zabbix server Timeout)
    - macro: '{$SYCOPE_ERROR_PERIOD}'
      value: 15m
      description: 'API checks failing: period in which every health check returned an error'
    - macro: '{$SYCOPE_NODATA_PERIOD}'
      value: 30m
      description: 'API checks failing: period without any health check result'
    - macro: '{$SYCOPE_CPU_MAX}'
      value: '90'
      description: CPU utilization threshold, %
    - macro: '{$SYCOPE_MEMORY_MAX}'
      value: '90'
      description: Memory utilization threshold, %
    - macro: '{$SYCOPE_DISK_PUSED_WARN}'
      value: '80'
      description: Disk usage warning threshold, %
    - macro: '{$SYCOPE_DISK_PUSED_CRIT}'
      value: '90'
      description: Disk usage high threshold, %
    - macro: '{$SYCOPE_METRICS_AGE_MAX}'
      value: '600'
      description: Maximum age of the newest self-monitoring record, seconds
    - macro: '{$SYCOPE_FLOWS_MIN}'
      value: '1'
      description: 'No-flows trigger: minimum decoded flows per second'
